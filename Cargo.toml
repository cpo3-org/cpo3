[package]
name = "cpo3"
version = "0.0.1"
authors = ["Matteo Santamaria", "Michael Cummins", "Brendan O'Donoghue"]
edition = "2024"
rust-version = "1.91"
description = "An interior-point solver for convex quadratic and linear programs, implemented in Rust with a Python interface"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/cpo3"
repository = "https://github.com/cpo3-org/cpo3"
keywords = ["optimization", "convex", "quadratic", "linear-programming", "interior-point"]
categories = ["mathematics"]
exclude = [
    "/benchmarks/data/**",
    "/dist/**",
    "/python/**/__pycache__/**",
    "/python/**/*.so",
    "/python/**/*.pyd",
    "/tests/**/__pycache__/**",
]

[package.metadata.docs.rs]
features = ["mps"]

[lib]
name = "cpo3"
crate-type = ["cdylib", "rlib"]

[features]
default = []
mps = ["dep:mps"]
accelerate = ["dep:cc"]
cholmod = ["dep:cc", "dep:pkg-config", "dep:libloading"]
pardiso = ["dep:libloading"]
python = [
    "dep:numpy",
    "dep:pyo3",
    "pyo3/abi3-py310",
    "pyo3/extension-module",
]

[dependencies]
presolve = "0.1.0"
faer = { version = "0.24.4", default-features = false, features = ["linalg", "sparse", "rayon", "std"] }
libloading = { version = "0.9.0", optional = true }
mps = { version = "1.0.1", optional = true }
numpy = { version = "0.30.0", optional = true }
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
pyo3 = { version = "0.30.1", optional = true }
tabled = { version = "0.22", default-features = false, features = ["std"] }
thiserror = "2"

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[profile.release]
codegen-units = 1
