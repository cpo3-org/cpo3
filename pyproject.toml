[project]
name = "cpo3"
authors = [
    { name = "Matteo Santamaria" },
    { name = "Michael Cummins" },
    { name = "Brendan O'Donoghue" },
]
dynamic = ["version"]
description = "An interior-point solver for convex quadratic and linear programs, implemented in Rust with a Python interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
    "LICENSE",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python", "mps"]
module-name = "cpo3._core"
python-source = "python"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
