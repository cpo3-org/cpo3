[project]
name = "cpo3"
authors = [
    { name = "Matteo Santamaria" },
    { name = "Michael Cummins" },
    { name = "Brendan O'Donoghue" },
]
dynamic = ["version"]
description = "An interior-point solver for convex quadratic and linear programs, implemented in Rust with a Python interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["optimization", "convex optimization", "quadratic programming", "linear programming", "interior-point"]
license-files = [
    "LICENSE",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.urls]
Repository = "https://github.com/cpo3-org/cpo3"
Documentation = "https://github.com/cpo3-org/cpo3#readme"
Issues = "https://github.com/cpo3-org/cpo3/issues"
Changelog = "https://github.com/cpo3-org/cpo3/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python", "mps"]
module-name = "cpo3.bindings"
python-source = "python"
include = [
    { path = "python/cpo3/py.typed", format = ["sdist", "wheel"] },
    { path = "python/cpo3/*.pyi", format = ["sdist", "wheel"] },
    { path = "tests/**/*", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
# Preserve blank lines between declarations in the bindings stub.
exclude = ["python/cpo3/bindings.pyi"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "src/**/*.c" },
    { file = "build.rs" },
]
