name: CI

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: ["1.91", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked
      - run: cargo test --locked --features mps
      - run: cargo doc --locked --no-deps --features mps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CPO3_REQUIRED_BACKENDS: ${{ matrix.os == 'macos-14' && 'faer,accelerate,cholmod' || 'faer,cholmod,pardiso' }}
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: native
          create-args: >-
            libcholmod>=5.2,<5.4
            ${{ runner.os != 'macOS' && 'mkl' || '' }}
          cache-environment: true
      - name: Configure native library paths
        run: |
          native_prefix="$CONDA_PREFIX${{ runner.os == 'Windows' && '/Library' || '' }}"
          echo "CHOLMOD_INCLUDE_DIR=$native_prefix/include/suitesparse" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "LD_LIBRARY_PATH=$native_prefix/lib" >> "$GITHUB_ENV"
          fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --features mps,accelerate,cholmod,pardiso
      - run: uv sync --locked --config-setting "build-args=--features=python,mps,accelerate,cholmod,pardiso"
      - run: uv run --no-sync ruff check . .github/scripts
      - run: uv run --no-sync ruff format --check . .github/scripts
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest -ra
