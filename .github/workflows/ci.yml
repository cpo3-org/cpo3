name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features mps --locked

  python-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv build --wheel --python "${{ matrix.python-version }}"
      - name: Test the installed wheel
        shell: bash
        run: |
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/cpo3-wheel"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python="$RUNNER_TEMP/cpo3-wheel/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/cpo3-wheel/bin/python"
          fi
          uv pip install --python "$wheel_python" dist/*.whl pytest
          uv run --no-project --python "$wheel_python" python -m pytest tests --full -ra --durations=10
